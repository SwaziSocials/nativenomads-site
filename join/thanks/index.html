<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You’re in · Native Nomads</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2130;--paper:#f7e8d9;--peach:#f3d5bd;--violet:#6a3fd1;--coral:#d0643a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--paper),var(--peach));color:var(--ink);font-family:Jost,system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
main{max-width:560px}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;opacity:.7;margin:0 0 14px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(40px,8vw,68px);line-height:1.05;margin:0 0 14px}
h1 em{color:var(--violet)}
p{font-size:19px;line-height:1.5;margin:0 0 10px;color:rgba(43,33,48,.8)}
.next{margin-top:26px;font-size:15px;letter-spacing:.04em;opacity:.75}
.next b{color:var(--coral);font-weight:500}
a.btn{display:inline-block;margin-top:22px;background:var(--violet);color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-size:16px;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Native Nomads</p>
  <h1>You’re <em>in.</em></h1>
  <p>Thank you for joining. Look for the letter in your inbox, with invite-only gatherings and new countries first.</p>
  <p class="next" id="next" hidden>Ready for the next person in <b id="s">8</b>…</p>
  <a class="btn" id="back" href="../../">Back to the site</a>
</main>
<script>
(function(){
  var kiosk=false; try{ kiosk=localStorage.getItem('nn-kiosk')==='1'; }catch(e){}
  var inFrame=window.top!==window.self;
  if(!kiosk && !inFrame){ return; }            /* normal visitor: just show the thank-you */
  var n=8, el=document.getElementById('s'), box=document.getElementById('next');
  box.hidden=false; if(kiosk) document.getElementById('back').hidden=true;
  var t=setInterval(function(){
    n--; el.textContent=n;
    if(n<=0){ clearInterval(t);
      var dest='/join/';
      try{ (window.top||window).location.replace(dest); }catch(e){ location.replace(dest); }
    }
  },1000);
})();
</script>
</body>
</html>
