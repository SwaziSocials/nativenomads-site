<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Join the letter · Native Nomads</title>
<meta name="description" content="Join the Native Nomads letter: invite-only gatherings, new countries and stories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2130;--paper:#f7e8d9;--peach:#f3d5bd;--violet:#6a3fd1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--paper),var(--peach));color:var(--ink);font-family:Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px max(18px,env(safe-area-inset-left)) 6px;font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.top a{color:inherit;text-decoration:none;opacity:.75}
.top a:hover,.top a:focus-visible{opacity:1}
.top .mark{font-family:'Playfair Display',Georgia,serif;font-style:italic;letter-spacing:.08em;text-transform:none;font-size:20px;opacity:.9}
iframe{flex:1;width:100%;border:0;min-height:0;background:transparent}
.kiosk .top a{pointer-events:none;opacity:.5}
noscript{padding:24px;display:block;text-align:center}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="top">
    <a class="mark" href="../" id="home">Native Nomads</a>
    <span>The letter</span>
  </div>
  <iframe id="f" title="Join the Native Nomads letter" src="https://form.jotform.com/263197647774171" allow="clipboard-write" loading="eager"></iframe>
  <noscript>Turn on JavaScript, or open the form directly: <a href="https://form.jotform.com/263197647774171">Join the Native Nomads letter</a>.</noscript>
</div>
<script>
/* /join/?kiosk=1 : event mode. Sticks until /join/?kiosk=0. After each signup the thank-you page
   waits a few seconds and comes back here with a fresh form for the next person. */
(function(){
  try{
    var q=location.search.match(/[?&]kiosk=(\d)/);
    if(q){ if(q[1]==='1') localStorage.setItem('nn-kiosk','1'); else localStorage.removeItem('nn-kiosk'); }
    if(localStorage.getItem('nn-kiosk')==='1') document.getElementById('shell').classList.add('kiosk');
  }catch(e){}
})();
</script>
</body>
</html>
